<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台南團險/產責險 開發追蹤地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:#0b3d91;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header h1{font-size:17px;margin:0 10px 0 0}header select,header input,header button{padding:5px 7px;border-radius:4px;border:1px solid #ccc;font-size:13px}
header button{background:#fff;cursor:pointer}#main{flex:1;display:flex;min-height:0}#map{flex:1}
#side{width:400px;overflow:auto;border-left:1px solid #ddd;padding:10px;font-size:14px;background:#fafafa}
#side h2{font-size:17px;margin:4px 0}label{display:block;margin-top:6px;font-size:13px;color:#444}
#side input,#side select,#side textarea{width:100%;padding:5px;font-size:14px}.row{display:flex;gap:6px}.row>*{flex:1}
.btn{background:#0b3d91;color:#fff;border:0;padding:7px 12px;border-radius:4px;margin-top:8px;cursor:pointer}.btn.g{background:#777}
.visit{border:1px solid #ddd;background:#fff;border-radius:4px;padding:6px;margin:6px 0}.tag{display:inline-block;padding:1px 6px;border-radius:8px;color:#fff;font-size:12px}
.legend{background:#fff;padding:6px;font-size:12px;line-height:18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#stats{font-size:12px;margin-left:auto}.li{padding:4px;border-bottom:1px solid #eee;cursor:pointer}.li:hover{background:#eef}
#mapwrap{flex:1;position:relative;display:flex}#sbox{position:absolute;top:10px;left:55px;z-index:1000;width:min(380px,70%)}#sq{width:100%;padding:10px 12px;font-size:16px;border:2px solid #0b3d91;border-radius:6px;box-shadow:0 2px 6px #0003}#sres{background:#fff;max-height:50vh;overflow:auto;border-radius:0 0 6px 6px;box-shadow:0 2px 6px #0003;font-size:14px}
@media(max-width:800px){#main{flex-direction:column}#side{width:100%;height:45%}}
</style></head><body>
<header><h1>台南 團險/產責險 開發地圖</h1>
<select id="fd"><option value="">全部行政區</option></select>
<select id="fc"><option value="">全部類別</option></select>
<select id="fs"><option value="">全部狀態</option></select>
<input id="q" placeholder="搜尋名稱/地址/電話" size="14">
<label style="display:none"><input type="checkbox" id="fp"> 只看有電話</label>
<label style="color:#fff;margin:0"><input type="checkbox" id="ff"> 待追蹤</label>
<label style="color:#fff;margin:0"><input type="checkbox" id="fx"> 工廠/團險</label>
<label style="color:#fff;margin:0"><input type="checkbox" id="fl"> 產品責任險</label>
<button class="adm" style="display:none" onclick="newBiz()">＋新增店家</button>
<button class="adm" style="display:none" onclick="refreshList()">⟳ 更新店家/工廠名單</button>
<button class="adm" style="display:none" onclick="location='/api/export.xlsx?type=visits'">匯出拜訪紀錄.xlsx</button>
<button class="adm" style="display:none" onclick="location='/api/export.xlsx?type=businesses'">匯出店家名單.xlsx</button>
<button class="adm" style="display:none" onclick="location='/api/export.xlsx?type=all'">匯出全部.xlsx</button>
<button class="adm" style="display:none" onclick="imp.click()">匯入 xlsx/json</button><input type="file" id="imp" accept=".xlsx,.json" hidden>
<button class="adm" style="display:none" onclick="exportJSON()">備份 JSON</button>
<button class="adm" style="display:none" onclick="usersPanel()">👥 帳號管理</button>
<span id="stats"></span><span id="me" style="font-size:12px"></span> <a href="/api/logout" style="color:#fff;font-size:12px">登出</a></header>
<div id="main"><div id="mapwrap"><div id="map"></div><div id="sbox"><input id="sq" placeholder="🔍 搜尋店名、地址、電話、行政區、類別、拜訪人" autocomplete="off"><div id="sres"></div></div></div><div id="side"></div></div>
<script>
const ST={"未拜訪":"#9e9e9e","已聯絡":"#1e88e5","有興趣":"#fb8c00","已成交":"#43a047","不需要":"#e53935"};
const DS=["南區","北區","東區","中西區","安南區","永康區","安定區"];
let DB={businesses:[],visits:[],meta:{}},layer,cur=null,online=true;
const map=L.map('map',{preferCanvas:true}).setView([23.0,120.21],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const lg=L.control({position:'bottomleft'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML=Object.entries(ST).map(([k,c])=>`<span class=dot style="background:${c}"></span>${k}`).join('<br>');return d};lg.addTo(map);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:typeof b==='string'||b instanceof Blob?b:JSON.stringify(b)});if(r.status===401){location='/login.html';throw Error('未登入')}const j=await r.json();if(j.error)throw Error(j.error);return j}
function saveCache(){try{const t=JSON.stringify(DB);if(t.length>1500000){localStorage.removeItem('tp_db');return}localStorage.setItem('tp_db',t)}catch(e){try{localStorage.removeItem('tp_db')}catch(_){}}}
function readCache(){try{return JSON.parse(localStorage.getItem('tp_db')||'null')}catch(e){return null}}
function loadMsg(t){let m=$('loadmsg');if(!m){m=document.createElement('div');m.id='loadmsg';m.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:14px 20px;border-radius:8px;box-shadow:0 2px 12px #0005;z-index:9999;font-size:15px';document.body.appendChild(m)}m.textContent=t;m.style.display=t?'':'none'}
async function fetchData(ms){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);try{const r=await fetch('/api/data',{cache:'no-store',signal:ac.signal});if(r.status===401){location='/login.html';throw Error('未登入')}if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j||!Array.isArray(j.businesses))throw Error('資料格式錯誤');return j}finally{clearTimeout(tm)}}
async function load(){const first=!DB||!DB.businesses||!DB.businesses.length;if(first)loadMsg('載入資料中…');let err;
 for(const [i,ms] of [[0,30000],[1,90000],[2,90000]]){try{DB=await fetchData(ms);online=true;err=null;break}catch(e){err=e;if(String(e.message)==='未登入')return;if(i<2){loadMsg('伺服器喚醒中，請稍候（約 30–60 秒）…');await new Promise(r=>setTimeout(r,3000))}}}
 loadMsg('');
 if(err){online=false;const c=readCache();DB=c&&Array.isArray(c.businesses)?c:{businesses:[],visits:[],meta:{}};alert(c?'無法連線伺服器，顯示本機快取資料（唯讀）':'無法連線伺服器，請檢查網路後重新整理');}
 else saveCache()
 fill();draw();}
function refresh(){const c=cur;draw();cur=c;saveCache()}
async function sync(){if(document.hidden)return;try{const r=await fetch('/api/sync',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j.n!==DB.businesses.length)return load();const before=JSON.stringify(DB.visits.map(v=>v.id+v.updated));DB.visits=j.visits;let ch=JSON.stringify(DB.visits.map(v=>v.id+v.updated))!==before;DB.businesses.forEach(b=>{const s=j.status[b.id]||'未拜訪';if((b.status||'未拜訪')!==s){b.status=s;ch=true}});if(ch&&!($('side').querySelector('#vt')&&document.activeElement&&document.activeElement.closest('#side'))){const c=cur;refresh();if(c&&c!=='new')show(c)}}catch(e){}}
setInterval(sync,60000);
function fill(){const opt=(el,arr)=>{const v=el.value;el.length=1;arr.forEach(x=>el.add(new Option(x,x)));el.value=v};
 opt($('fd'),DS);opt($('fc'),[...new Set(DB.businesses.map(b=>b.category))].sort());opt($('fs'),Object.keys(ST));}
function lastVisit(id){return DB.visits.filter(v=>v.business_id===id).sort((a,b)=>String(b.date).localeCompare(a.date))[0]}
const PLC=['工廠','工廠/製造','食品製造','餐飲','食品零售'],PLS=new Set('bakery pastry confectionery deli tea coffee beverages butcher cheese chocolate pasta ice_cream dairy rice health_food nutrition_supplements herbalist food farm bbq marketplace craft pottery leather tailor shoemaker carpenter metal_construction machine_shop works factory industrial kitchen furniture perfumery'.split(' ')),PLN=/食品|烘焙|麵包|蛋糕|糕餅|餅|茶|咖啡|飲料|冰|豆花|小吃|餐|麵|飯|食|肉|製造|工業|工廠|實業|加工|手作|釀/;
function plAuto(b){return b.source==='非登不可'||PLC.includes(b.category)||PLS.has(b.subtype)||PLN.test(b.name||'')}
function isPL(b){return b.pl==='Y'?true:b.pl==='N'?false:plAuto(b)}
function g5(b){return b.group5===true||Number(b.employees)>=5}
const VN={shihhan:'仕翰'};function vn(x){return VN[x]||x}
let MK={};
function hay(b){return [b.name,b.address,b.phone,b.district,b.category,b.subtype,b.industry,b.products,...DB.visits.filter(v=>v.business_id===b.id).flatMap(v=>[v.visitor,vn(v.visitor),v.created_by])].join(' ').toLowerCase()}
function doSearch(){const q=$('sq').value.trim().toLowerCase(),el=$('sres');if(!q){el.innerHTML='';return}const t=q.split(/\s+/),r=filtered().filter(b=>{const h=hay(b);return t.every(x=>h.includes(x))});
 el.innerHTML=`<div style="padding:4px 8px;color:#666">${r.length} 筆${r.length>50?'（顯示前 50）':''}</div>`+r.slice(0,50).map(b=>`<div class=li onclick="pick('${b.id}')">${esc(b.name)} <small>${esc(b.district)}｜${esc(b.category)} ${esc(b.phone)}<br>${esc(b.address)}</small></div>`).join('')}
function pick(id){$('sres').innerHTML='';const b=DB.businesses.find(x=>x.id===id);if(b&&b.lat!=null&&b.lat!==''){map.flyTo([b.lat,b.lng],17);const m=MK[id];if(m)setTimeout(()=>m.openPopup(),400)}show(id)}
function filtered(){const d=$('fd').value,c=$('fc').value,s=$('fs').value,q=$('q').value.trim(),today=new Date().toISOString().slice(0,10);
 return DB.businesses.filter(b=>(!d||b.district===d)&&(!c||b.category===c)&&(!s||(b.status||'未拜訪')===s)&&(!$('fp').checked||b.phone)&&(!$('fx').checked||String(b.category).startsWith('工廠'))&&(!$('fl').checked||isPL(b))
 &&(!q||hay(b).includes(q.toLowerCase()))&&(!$('ff').checked||((lastVisit(b.id)||{}).next_followup||'9')<=today))}
function draw(){if(layer)map.removeLayer(layer);layer=L.layerGroup().addTo(map);MK={};const f=filtered();
 f.forEach(b=>{if(b.lat==null||b.lat==='')return;MK[b.id]=L.circleMarker([b.lat,b.lng],{radius:b.status&&b.status!=='未拜訪'?8:5,color:'#333',weight:1,fillColor:ST[b.status||'未拜訪'],fillOpacity:.85})
 .bindTooltip(esc(b.name)).bindPopup(()=>`<b>${esc(b.name)}</b><br>${esc(b.district)}｜${esc(b.category)}<br>${esc(b.address)}${b.phone?'<br>📞 '+esc(b.phone):''}`).on('click',()=>show(b.id)).addTo(layer)});
 const cnt=s=>DB.businesses.filter(b=>(b.status||'未拜訪')===s).length;
 $('stats').innerHTML=`顯示 ${f.length} / ${DB.businesses.length} 家｜`+Object.keys(ST).map(s=>s+' '+cnt(s)).join('｜')+`｜產責對象 ${DB.businesses.filter(isPL).length}｜團險有興趣 ${new Set(DB.visits.filter(v=>v.interest_group).map(v=>v.business_id)).size}｜產責有興趣 ${new Set(DB.visits.filter(v=>v.interest_pl).map(v=>v.business_id)).size}｜名單更新：${esc(DB.meta.last_refresh||'')}`;
 if(!cur)listView(f)}
function listView(f){const today=new Date().toISOString().slice(0,10);
 const fu=DB.visits.filter(v=>v.next_followup).sort((a,b)=>a.next_followup.localeCompare(b.next_followup)).slice(0,30);
 $('side').innerHTML=`<h2>待追蹤（依下次追蹤日）</h2>${fu.map(v=>`<div class=li onclick="show('${v.business_id}')">${v.next_followup<=today?'⚠️':''}${esc(v.next_followup)} ${esc(v.business_name)}｜${esc(vn(v.visitor))}｜${esc(v.status)}</div>`).join('')||'<i>尚無</i>'}
 <h2 style="margin-top:12px">名單（前 200 筆，點選定位）</h2>${f.slice(0,200).map(b=>`<div class=li onclick="show('${b.id}',1)"><span class=dot style="background:${ST[b.status||'未拜訪']}"></span>${esc(b.name)} <small>${esc(b.district)}｜${esc(b.category)} ${esc(b.phone)}</small></div>`).join('')}`}
function show(id,fly){cur=id;const b=DB.businesses.find(x=>x.id===id);if(!b)return;if(fly&&b.lat)map.setView([b.lat,b.lng],17);
 const vs=DB.visits.filter(v=>v.business_id===id).sort((a,b)=>String(b.date).localeCompare(a.date));const me=vn(ME||localStorage.getItem('tp_visitor')||''),today=new Date().toISOString().slice(0,10);
 $('side').innerHTML=`<button class="btn g" onclick="cur=null;draw()">← 返回清單</button>
 <h2>${esc(b.name)} <span class=tag style="background:${ST[b.status||'未拜訪']}">${esc(b.status||'未拜訪')}</span></h2>
 <div>${esc(b.district)}｜${esc(b.category)} ${esc(b.subtype)}</div><div>📍 ${esc(b.address)||'<i>地址未知</i>'}</div>${b.industry?`<div>🏭 ${esc(b.industry)}｜${esc(b.products)}</div><div><small>登記編號 ${esc(b.factory_reg_no)}｜統編 ${esc(b.tax_id)}｜${esc(b.org_type)}｜負責人 ${esc(b.owner)}</small></div>`:''}${b.capital?`<div>💰 資本額 ${Number(b.capital).toLocaleString()} 元</div>`:''}<div>👥 員工人數：${b.employees?esc(b.employees)+' 人'+(g5(b)?' <span class=tag style="background:#2a7">團險5人以上</span>':''):'<i>未知（可於編輯填入）</i>'}</div>${b.geo_precision&&b.geo_precision!=='exact'?`<div><small>⚠️ 座標為${{road:'路段',village:'里',district:'行政區'}[b.geo_precision]||''}概略位置</small></div>`:''}
 <div>📞 ${b.phone?`<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`:'<i>電話未知</i>'}</div>${b.website?`<div>🌐 <a target=_blank href="${esc(b.website)}">${esc(b.website)}</a></div>`:''}
 <div><a target=_blank style="display:inline-block;background:#1a73e8;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:bold" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.name+' '+((b.address||'').replace(/（約略）/g,'')||('台南市'+(b.district||''))))}">📍 Google 地圖查位置</a>｜<small>${esc(b.source)}</small></div>
 <button class="btn g" onclick="editBiz('${id}')">編輯店家資料</button>
 <h2 style="margin-top:12px">新增拜訪紀錄</h2>
 <div class=row><div><label>拜訪日期</label><input type=date id=vd value="${today}"></div><div><label>拜訪人</label><input id=vv value="${esc(me)}" ${ADM?'':'readonly style="background:#eee"'}></div></div>
 <label>聯絡人（對方窗口）</label><input id=vc>
 <div class=row><label><input type=checkbox id=vg style="width:auto"> 團險有興趣</label><label><input type=checkbox id=vp style="width:auto"> 產責險有興趣</label></div>
 <div class=row><div><label>狀態</label><select id=vs>${Object.keys(ST).map(s=>`<option ${s===(b.status&&b.status!=='未拜訪'?b.status:'已聯絡')?'selected':''}>${s}</option>`).join('')}</select></div><div><label>下次追蹤日</label><input type=date id=vn></div></div>
 <label>備註</label><textarea id=vt rows=3></textarea><button class=btn onclick="addVisit('${id}')">儲存紀錄</button>
 <h2 style="margin-top:12px">拜訪歷史（${vs.length}）</h2>${vs.map(v=>`<div class=visit><b>${esc(v.date)}</b> ${esc(vn(v.visitor))} <span class=tag style="background:${ST[v.status]||'#999'}">${esc(v.status)}</span>
 <div>聯絡人：${esc(v.contact)}｜團險：${v.interest_group?'有':'—'}｜產責：${v.interest_pl?'有':'—'}</div><div>下次追蹤：${esc(v.next_followup)||'—'}　<small>登錄：${esc(v.created_by||'')}</small></div><div style="white-space:pre-wrap">${esc(v.notes)}</div>
 ${ADM||v.created_by===ME?`<a href="#" onclick="delVisit('${v.id}');return false" style="color:#c00;font-size:12px">刪除</a>`:''}</div>`).join('')||'<i>尚無紀錄</i>'}`}
async function addVisit(id){const v={business_id:id,date:$('vd').value,visitor:ADM?$('vv').value.trim():ME,contact:$('vc').value,interest_group:$('vg').checked,interest_pl:$('vp').checked,status:$('vs').value,next_followup:$('vn').value,notes:$('vt').value};
 if(!v.visitor)return alert('請填拜訪人');const r=await api('/api/visit',v);DB.visits=DB.visits.filter(x=>x.id!==r.id);DB.visits.push(r);const bz=DB.businesses.find(x=>x.id===id);if(bz&&r.status)bz.status=r.status;refresh();show(id)}
async function delVisit(i){if(!confirm('確定刪除此紀錄？'))return;const vv=DB.visits.find(x=>x.id===i);const r=await api('/api/visit/delete',{id:i});DB.visits=DB.visits.filter(x=>x.id!==i);const bz=vv&&DB.businesses.find(x=>x.id===vv.business_id);if(bz&&r.business_status)bz.status=r.business_status;refresh();show(cur)}
function bizForm(b){const c=map.getCenter();b=b||{lat:c.lat.toFixed(6),lng:c.lng.toFixed(6),district:$('fd').value||'東區',category:'工廠/製造'};
 $('side').innerHTML=`<button class="btn g" onclick="cur=null;draw()">← 返回</button><h2>${b.id?'編輯':'新增'}店家/工廠</h2>
 ${[['name','名稱'],['address','地址'],['phone','電話'],['website','網站'],['subtype','細類'],['employees','員工人數'],['note','備註']].map(([k,l])=>`<label>${l}</label><input id=b_${k} value="${esc(b[k])}">`).join('')}
 <label>產責對象</label><select id=b_pl><option value=''>自動判斷（目前：${plAuto(b)?'是':'否'}）</option><option value=Y ${b.pl==='Y'?'selected':''}>是</option><option value=N ${b.pl==='N'?'selected':''}>否</option></select>
 <label>行政區</label><select id=b_district>${DS.map(d=>`<option ${d===b.district?'selected':''}>${d}</option>`).join('')}</select>
 <label>類別</label><input id=b_category list=cats value="${esc(b.category)}"><datalist id=cats>${[...new Set(DB.businesses.map(x=>x.category))].map(x=>`<option>${esc(x)}`).join('')}</datalist>
 <div class=row><div><label>緯度</label><input id=b_lat value="${esc(b.lat)}"></div><div><label>經度</label><input id=b_lng value="${esc(b.lng)}"></div></div>
 <small>提示：在地圖上點一下可帶入座標</small><br><button class=btn onclick="saveBiz('${b.id||''}')">儲存</button>`;
 map.once('click',e=>{if($('b_lat')){$('b_lat').value=e.latlng.lat.toFixed(6);$('b_lng').value=e.latlng.lng.toFixed(6)}})}
function newBiz(){cur='new';bizForm()}function editBiz(id){bizForm(DB.businesses.find(x=>x.id===id))}
async function saveBiz(id){const b={};['name','address','phone','website','subtype','employees','note','district','category','lat','lng','pl'].forEach(k=>b[k]=$('b_'+k).value.trim());b.employees=b.employees?parseInt(b.employees)||'':'';b.group5=Number(b.employees)>=5;
 if(!b.name)return alert('請填名稱');b.lat=parseFloat(b.lat);b.lng=parseFloat(b.lng);if(id)b.id=id;const r=await api('/api/business',b);await load();show(r.id,1)}
async function refreshList(){if(!confirm('重新抓取 OpenStreetMap 店家 + 非登不可食品業者登錄（台南七區）？\n只會新增非連鎖的新店家，既有拜訪紀錄與手動資料不會遺失（約需 2–8 分鐘，背景執行）'))return;
 try{await api('/api/refresh',{})}catch(e){return alert('更新失敗：'+e.message)}
 const tick=async()=>{try{const r=await (await fetch('/api/refresh_status',{cache:'no-store'})).json();if(r.running){$('stats').textContent='名單更新中：'+(r.step||'')+'…';return setTimeout(tick,5000)}
 const x=r.result||{};alert(`更新完成：OSM 新增 ${x.osm_added??'-'} 家、更新 ${x.osm_updated??'-'} 家；非登不可新增 ${x.fda_added??'-'} 家（排除連鎖 ${x.fda_chains_removed??'-'}、重複 ${x.fda_duplicates??'-'}）；共 ${x.total} 家`+(x.osm_error?'\nOSM 錯誤：'+x.osm_error:'')+(x.fda_error?'\n非登不可錯誤：'+x.fda_error:''));load()}catch(e){setTimeout(tick,8000)}};tick()}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='tainan_backup.json';a.click()}
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const r=f.name.endsWith('.json')?await api('/api/import.json',await f.text()):await api('/api/import.xlsx',f);alert('匯入完成：'+JSON.stringify(r))}catch(x){alert('匯入失敗：'+x.message)}e.target.value='';load()};
['fd','fc','fs','fp','ff','fx','fl'].forEach(i=>$(i).onchange=()=>{cur=null;draw();doSearch()});$('q').oninput=()=>{cur=null;draw()};$('sq').oninput=doSearch;$('sq').onkeydown=e=>{if(e.key==='Enter'){const f=$('sres').querySelector('.li');if(f)f.click()}if(e.key==='Escape')$('sres').innerHTML=''};
fetch('/api/me').then(r=>r.json()).then(j=>{if(!j.user)location='/login.html';ME=j.user;$('me').textContent='　👤 '+j.user+(j.is_admin?'（管理員）':'');if(j.is_admin){ADM=true;document.querySelectorAll('.adm').forEach(e=>e.style.display='')}if(!localStorage.getItem('tp_visitor'))localStorage.setItem('tp_visitor',j.user)});
let ADM=false,ME='';
async function usersPanel(){cur='users';const r=await api('/api/users');
 $('side').innerHTML=`<button class="btn g" onclick="cur=null;draw()">← 返回</button><h2>帳號管理（${r.users.length}）</h2>
 <div class=row><input id=nu placeholder="同事名字（即帳號）"><button class=btn onclick="uAct('add',$('nu').value)">新增（密碼 1234）</button></div>
 ${r.users.map(u=>`<div class=li>${esc(u.name)} ${u.is_admin?'<small>管理員</small>':''}
  <a href="#" onclick="uAct('reset',${esc(JSON.stringify(u.name))});return false">重設密碼為 1234</a>
  ${u.is_admin?'':`｜<a href="#" style="color:#c00" onclick="uAct('delete',${esc(JSON.stringify(u.name))});return false">刪除</a>`}</div>`).join('')}`}
async function uAct(a,n){n=(n||'').trim();if(!n)return alert('請輸入名字');
 if(a==='delete'&&!confirm('確定刪除帳號「'+n+'」？'))return;if(a==='reset'&&!confirm('把「'+n+'」密碼重設為 1234？'))return;
 try{await api('/api/users/'+a,{name:n});alert('完成')}catch(e){alert(e.message)}usersPanel()}
load();
</script></body></html>
